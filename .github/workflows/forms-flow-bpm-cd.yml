name: Push Forms flow BPM to registry

on:
  workflow_dispatch:
  push:
    branches: [ master, develop, release/* ]
    paths:
      - "forms-flow-bpm/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-bpm

jobs:
  build-and-push-image-to-dockerhub:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: formsflow/forms-flow-bpm
            context: forms-flow-bpm
            dockerfile: Dockerfile
            name: forms-flow-bpm
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          install: true
      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - run: echo ${{ env.VERSION }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@2af9c6a52b5431eea749f0e923b7503b84813f77
        with:
          images: ${{ matrix.image }}
          tags: ${{ env.VERSION }}

      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@56744aa47577854fb24ebdf67fce890ee83d9d41
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 3600
      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
         username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
         password: ${{ steps.docker_oidc.outputs.token }}

      - name: Cache Docker layers
        uses: actions/cache@13aacd865c20de90d75de3b17ebe84f7a17d57d2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}
      - name: Build and push Docker image from non master branch
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: forms-flow-bpm
          push: true
          file: forms-flow-bpm/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push Docker image from master branch
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with: 
          context: forms-flow-bpm
          push: true
          platforms: linux/amd64,linux/arm64/v8
          file: forms-flow-bpm/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}, formsflow/forms-flow-bpm:latest
          labels: ${{ steps.meta.outputs.labels }}  
      - name: Scan Docker image 🐳
        uses: snyk/actions/docker@master
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.tags }}
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Replace security-severity undefined for license-related findings
        run: |
          # Check if Snyk SARIF file exists before processing
          if [ -f snyk.sarif ]; then
            # Use jq to properly handle JSON and replace null values with 0
            jq 'walk(if type == "object" and has("security-severity") and ."security-severity" == null then ."security-severity" = "0" else . end)' snyk.sarif > snyk_processed.sarif
            mv snyk_processed.sarif snyk.sarif
            
            # Verify the file was processed
            echo "Snyk SARIF file processed"
          else
            echo "No Snyk SARIF file found. Skipping replacement."
            # Optionally, you can choose to exit with a non-zero code if this is critical
            # exit 1
          fi
      - name: Upload Snyk report as sarif 📦
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::653405621825:role/githubaction-formsflow-eks-deploy
          aws-region: ca-central-1
          role-session-name: github-actions-eks-deploy

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Update Kube config
        run: aws eks update-kubeconfig --region ca-central-1 --name ${{ secrets.DEV_EKS_CLUSTER }}

      - name: Deploy to eks
        run: |
          kubectl -n ${{ secrets.DEV_OPENSOURCE_NAMESPACE }} patch deployment forms-flow-bpm -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-bpm","image":"docker.io/formsflow/forms-flow-bpm:${{ env.VERSION }}"}]}}}}'
          kubectl -n ${{ secrets.DEV_OPENSOURCE_NAMESPACE }} rollout restart deployment forms-flow-bpm
    notify:
      needs: build-and-push-image-to-dockerhub
      if: always()
      uses: ./.github/workflows/notify-google-chat.yml
      with:
        status: ${{ needs.build-and-push-image-to-dockerhub.result }}
        component: "forms-flow-bpm"
        image: "${{ needs.build-and-push-image-to-dockerhub.outputs.image }}"
        branch: ${{ github.ref_name }}
        commit: ${{ github.sha }}
        actor: ${{ github.actor }}
        workflow: ${{ github.workflow }}
        run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      secrets:
        GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DOCKER_HUB_DEPLOY_GOOGLE_CHAT_WEBHOOK_URL }}